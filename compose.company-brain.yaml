services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: company_brain
      POSTGRES_USER: company_brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "54329:5432"
    volumes:
      - company_brain_postgres:/var/lib/postgresql/data
      - ./migrations/001_company_brain.sql:/docker-entrypoint-initdb.d/001_company_brain.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_brain -d company_brain"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: company-brain.Dockerfile
    environment:
      DATABASE_URL: postgresql://company_brain:${POSTGRES_PASSWORD}@db:5432/company_brain
      COMPANY_BRAIN_API_KEY: ${COMPANY_BRAIN_API_KEY}
    ports:
      - "8088:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  company_brain_postgres:
